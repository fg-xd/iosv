[buildPlans.Fgxd]
family = "fgxd"
spacing = "term"
serifs = "sans"
noCvSs = true
export-glyph-names = false

hintParams = ["-a", "qqq"]

[buildPlans.Fgxd.variants]
inherits = "ss08"

[buildPlans.Fgxd.widths.normal]
shape = 550
menu  = 5
css   = "normal"

[buildPlans.Fgxd.metric-override]
leading = 1100
xHeight = 550

[buildPlans.Fgxd.variants.design]
    three = "two-arcs"
    zero = "diamond-reverse-slashed-split"
    capital-j = "serifed"
    f = "flat-hook-serifed"
    l = "serifed"
    lower-theta = "diamond"
    asterisk = "turn-hex-low"
    caret = "low"
    paren = "normal"
    brace = "curly-flat-boundary"
    ampersand = "closed"
    at = "threefold-solid-inner"
    percent = "dots"

[buildPlans.Fgxd.weights.regular]
shape = 450
menu = 400
css = 400

[buildPlans.Fgxd.weights.bold]
shape = 800
menu = 700
css = 700

[buildPlans.Fgxd.slopes]
upright = "default.upright"
italic = "default.italic"
